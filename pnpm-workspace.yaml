packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  zod: 4.6.7
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
  wrangler: 4.151.0
  "@cloudflare/vite-plugin": 1.64.0
  "@tailwindcss/vite": 4.3.3
  tailwindcss: 4.3.3
  "@base-ui/react": ^1.9.0
  "@fontsource-variable/inter": ^5.3.0
  "@hugeicons/core-free-icons": ^4.3.5
  "@hugeicons/react": ^1.1.10
  class-variance-authority: ^0.7.1
  cn: ^0.4.0
  shadcn: ^4.21.5
  tw-animate-css: ^1.4.0
  better-auth: 1.7.10
  "@better-auth/drizzle-adapter": 1.7.10
  "@hono/zod-validator": 0.9.1
  "@shadcn/lint": ^0.2.1
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@vitest/browser-preview@5.0.5"
  - "@vitest/browser@5.0.5"
  - "@vitest/mocker@5.0.5"
  - "@vitest/pretty-format@5.0.5"
  - "@vitest/snapshot@5.0.5"
  - "@vitest/spy@5.0.5"
  - "@vitest/ui@5.0.5"
  - "@vitest/utils@5.0.5"
  - "@voidzero-dev/vite-plus-core@1.3.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.3.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.3.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.3.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.3.0"
  - vite-plus@1.3.0
  - vitest@5.0.5
  - "@better-auth/core@1.7.10"
  - "@better-auth/drizzle-adapter@1.7.10"
  - "@better-auth/kysely-adapter@1.7.10"
  - "@better-auth/memory-adapter@1.7.10"
  - "@better-auth/mongo-adapter@1.7.10"
  - "@better-auth/prisma-adapter@1.7.10"
  - "@better-auth/telemetry@1.7.10"
  - auth@1.7.10
  - better-auth@1.7.10
allowBuilds:
  esbuild: true
  workerd: true
  better-sqlite3: true
